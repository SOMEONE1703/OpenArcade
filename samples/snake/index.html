<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas { background: #020617; border-radius: 8px; max-width: 95vw; max-height: 80vh; touch-action: none; }
</style>
</head>
<body>
<div id="score">Score: 0 · press an arrow key to start</div>
<canvas id="c" width="400" height="400"></canvas>
<script>
const N = 20, S = 20, ctx = document.getElementById('c').getContext('2d'), scoreEl = document.getElementById('score');
let snake, dir, next, food, score, timer;
function reset() {
  snake = [{x: 10, y: 10}]; dir = {x: 0, y: 0}; next = dir; score = 0; placeFood(); draw();
}
function placeFood() {
  do { food = {x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N)}; }
  while (snake.some(p => p.x === food.x && p.y === food.y));
}
function step() {
  dir = next;
  if (!dir.x && !dir.y) return;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some(p => p.x === head.x && p.y === head.y)) {
    scoreEl.textContent = `Game over · score ${score} · press an arrow key`; reset(); return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) { score++; placeFood(); } else snake.pop();
  scoreEl.textContent = `Score: ${score}`;
  draw();
}
function draw() {
  ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, 400, 400);
  ctx.fillStyle = '#ef4444'; ctx.fillRect(food.x * S, food.y * S, S - 2, S - 2);
  ctx.fillStyle = '#22c55e'; snake.forEach(p => ctx.fillRect(p.x * S, p.y * S, S - 2, S - 2));
}
function turn(x, y) { if (snake.length > 1 && x === -dir.x && y === -dir.y) return; next = {x, y}; }
addEventListener('keydown', e => {
  const k = {ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0]}[e.key];
  if (k) { e.preventDefault(); turn(...k); }
});
let touch;
addEventListener('touchstart', e => { touch = e.touches[0]; });
addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - touch.clientX, dy = t.clientY - touch.clientY;
  if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
});
reset();
timer = setInterval(step, 120);
</script>
</body>
</html>
